name: CI

on:
  pull_request:
  push:
    branches: [main, phase1-foundation]

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: copydesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d copydesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @salts/database db:generate
      - run: pnpm --filter @salts/database exec prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/copydesk?schema=public
      - run: pnpm --filter @salts/database db:migrate:deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/copydesk?schema=public
      - run: pnpm --filter @salts/database db:migrate:status
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/copydesk?schema=public
      - name: Test domain package
        run: pnpm --filter @salts/domain test
      - name: Test adapter package
        run: pnpm --filter @salts/adapters test
      - name: Test API package
        run: pnpm --filter @salts/api test
      - name: Test web package
        run: pnpm --filter @salts/web test
      - name: Typecheck domain
        run: pnpm --filter @salts/domain typecheck
      - name: Typecheck adapters
        run: pnpm --filter @salts/adapters typecheck
      - name: Build database package
        run: pnpm --filter @salts/database build
      - name: Build API
        run: pnpm --filter @salts/api build
      - name: Typecheck web
        run: pnpm --filter @salts/web typecheck
      - name: Build web
        run: pnpm --filter @salts/web build
